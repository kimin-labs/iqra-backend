<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqra AI — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

    <div class="auth-page">
        <div class="auth-glow"></div>
        <div class="auth-container glass" id="authContainer">
            <div class="auth-header">
                <i class="fas fa-mosque auth-logo"></i>
                <h1>Iqra AI</h1>
                <p>Msaidizi wa Kiislamu kwa Vijana wa Tanzania</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab">Sign In</button>
                <button class="auth-tab" id="signupTab">Create Account</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <p class="auth-error" id="loginError"></p>
            </form>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" class="form-input" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="form-input" placeholder="Create a password (min 4 chars)" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <p class="auth-error" id="signupError"></p>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
